services:
  - type: web
    name: banking-system
    runtime: docker
    repo: https://github.com/kartikthakur711/BankingSystem
    branch: main
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_ACCESS_EXPIRATION_MS
        value: "600000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: RATE_LIMIT_LOGIN_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_LOGIN_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_TRANSFER_MAX_REQUESTS
        value: "20"
      - key: RATE_LIMIT_TRANSFER_WINDOW_MS
        value: "60000"
