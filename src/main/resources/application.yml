spring:
  application:
    name: banking-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/banking_system}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-random-secret-key-please-change}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Platform Admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@banking.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    org.springframework.security: INFO
