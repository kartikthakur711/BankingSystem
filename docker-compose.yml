version: '3.9'
services:
  mongodb:
    image: mongo:7
    container_name: banking-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: banking-app
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/banking_system
      JWT_SECRET: change-this-to-a-very-long-random-secret-key-please-change
      BOOTSTRAP_ADMIN_EMAIL: admin@banking.local
      BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
    ports:
      - "8080:8080"

volumes:
  mongo_data:
