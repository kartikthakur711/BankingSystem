spring:
  application:
    name: banking-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/banking_system}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-random-secret-key-please-change}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
      window-ms: ${RATE_LIMIT_LOGIN_WINDOW_MS:60000}
    transfer:
      max-requests: ${RATE_LIMIT_TRANSFER_MAX_REQUESTS:20}
      window-ms: ${RATE_LIMIT_TRANSFER_WINDOW_MS:60000}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Platform Admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@banking.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
